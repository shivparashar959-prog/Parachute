services:
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: ${DOCGUARD_DATABASE_URL:?Set DOCGUARD_DATABASE_URL in .env}
      CELERY_BROKER_URL: ${DOCGUARD_CELERY_BROKER_URL:?Set DOCGUARD_CELERY_BROKER_URL in .env}
      SESSION_COOKIE_SECURE: "false"
      FRONTEND_ORIGIN: http://localhost:8080
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      GITHUB_OAUTH_REDIRECT_URI: http://localhost:8080/api/auth/callback
      GITHUB_APP_SETUP_URL: http://localhost:8080/api/github/installations/callback
      GITHUB_APP_USER_CALLBACK_URL: http://localhost:8080/api/github/user-callback
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment:
      APP_ENV: development
      DATABASE_URL: ${DOCGUARD_DATABASE_URL:?Set DOCGUARD_DATABASE_URL in .env}
      CELERY_BROKER_URL: ${DOCGUARD_CELERY_BROKER_URL:?Set DOCGUARD_CELERY_BROKER_URL in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docguard
      POSTGRES_USER: docguard
      POSTGRES_PASSWORD: ${DOCGUARD_DB_PASSWORD:?Set DOCGUARD_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docguard -d docguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${DOCGUARD_REDIS_PASSWORD:?Set DOCGUARD_REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DOCGUARD_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: development
      DATABASE_URL: ${DOCGUARD_DATABASE_URL:?Set DOCGUARD_DATABASE_URL in .env}
      CELERY_BROKER_URL: ${DOCGUARD_CELERY_BROKER_URL:?Set DOCGUARD_CELERY_BROKER_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
